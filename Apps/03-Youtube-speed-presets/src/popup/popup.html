<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <h2>YouTube Speed Presets</h2>

        <div id="status" class="status">Detecting channel...</div>

        <div class="control-group">
            <label for="speed">Playback Speed:</label>
            <input type="number" id="speed" min="0.25" max="4.0" step="0.25" value="1.0">
        </div>

        <div class="actions">
            <button id="saveBtn" class="primary">Save Preset</button>
            <button id="resetBtn" class="secondary">Reset</button>
        </div>

        <div class="footer">
            <small>Default: 1.0x</small>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
