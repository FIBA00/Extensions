<!DOCTYPE html>
<html>

<head>
    <title>Dark Mode Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <h2>Dark Mode</h2>
        <div class="site-info">
            <span id="site-name">Current Site</span>
        </div>

        <label class="switch">
            <input type="checkbox" id="toggle-dark-mode">
            <span class="slider round"></span>
        </label>

        <p id="status-text">Disabled</p>
    </div>
    <script src="popup.js"></script>
</body>

</html>
